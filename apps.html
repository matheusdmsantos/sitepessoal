<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Apps Pessoais — Matheus Miranda</title>
  <link rel="stylesheet" href="css/apps.css" />
  <style>
    body.auth-pending { visibility: hidden; }
    a.app-card { color: inherit; text-decoration: none; }
    .app-card.is-soon { cursor: default; opacity: 0.7; }
  </style>
</head>
<body class="auth-pending">

  <header class="topbar" role="banner">
    <a href="portfolio.html" class="topbar-logo" aria-label="Voltar ao portfólio">
      <div class="topbar-logo-icon" aria-hidden="true">⚡</div>
      <div>
        <span class="topbar-logo-text">Matheus Miranda</span>
        <span class="topbar-logo-sub">Área Pessoal</span>
      </div>
    </a>

    <div class="topbar-search">
      <span class="search-icon" aria-hidden="true">🔍</span>
      <input type="search" id="search-input" placeholder="Buscar apps…" aria-label="Buscar aplicações" autocomplete="off" />
    </div>

    <div class="topbar-spacer" aria-hidden="true"></div>

    <div class="topbar-user">
      <div class="user-avatar" aria-hidden="true" id="user-initials">MM</div>
      <span class="user-name" id="user-display-name"></span>
    </div>

    <button class="logout-btn" id="logout-btn" type="button">
      <svg width="13" height="13" viewBox="0 0 13 13" fill="none" aria-hidden="true">
        <path d="M5 2H2C1.45 2 1 2.45 1 3v7c0 .55.45 1 1 1h3M9 9.5L12 6.5M12 6.5L9 3.5M12 6.5H5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Sair
    </button>
  </header>

  <div class="app-layout">
    <aside class="sidebar" id="sidebar" aria-label="Navegação por categorias">
      <nav id="sidebar-nav" aria-label="Categorias de apps"></nav>
    </aside>

    <main class="main-area" id="main-area">

      <section id="panel-apps" aria-label="Aplicações pessoais">
        <div class="panel-header">
          <h1 class="panel-title">Minhas aplicações</h1>
          <p class="panel-subtitle">Ferramentas pessoais, sempre disponíveis</p>
        </div>

        <div class="filter-bar" id="filter-bar" role="group" aria-label="Filtrar por categoria"></div>

        <div class="apps-grid-container">
          <div class="apps-grid" id="apps-grid" role="list" aria-label="Aplicações"></div>
          <div id="apps-empty" class="apps-empty" aria-live="polite">
            <span class="apps-empty-icon" aria-hidden="true">🔍</span>
            <p>Nenhum app nesta categoria com esse termo. Limpe a busca ou escolha “Todos”.</p>
          </div>
          <p id="apps-error" class="apps-empty" role="alert" hidden></p>
        </div>
      </section>

      <section id="panel-viewer" aria-label="Visualizador de aplicação" aria-live="polite">
        <div class="viewer-toolbar">
          <button class="viewer-back" id="viewer-back-btn" type="button" aria-label="Voltar para a lista de apps">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
              <path d="M11 7H3M6 4L3 7L6 10" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Voltar
          </button>
          <div class="viewer-title">
            <span class="viewer-title-icon" id="viewer-title-icon" aria-hidden="true">⚡</span>
            <span id="viewer-title-text">App</span>
          </div>
          <div class="viewer-url-bar">
            <span class="url-lock" aria-hidden="true">🔒</span>
            <span id="viewer-url-text">—</span>
          </div>
          <div class="viewer-actions">
            <button class="viewer-action-btn" id="viewer-reload" type="button" title="Recarregar" aria-label="Recarregar aplicação">🔄</button>
            <button class="viewer-action-btn" id="viewer-newtab" type="button" title="Abrir em nova aba" aria-label="Abrir em nova aba">↗️</button>
          </div>
        </div>

        <div class="app-iframe-wrap">
          <div id="iframe-loading" class="iframe-loading">
            <div class="iframe-spinner" aria-hidden="true"></div>
            <span>Carregando aplicação…</span>
          </div>
          <iframe id="app-iframe" class="app-iframe" title="Aplicação pessoal"
                  sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-downloads"></iframe>
        </div>
      </section>

    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script>if (!requireAuth()) throw new Error('Não autenticado');</script>
  <script src="js/apps.js"></script>
</body>
</html>
