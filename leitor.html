<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Leitor de PDF</title>
  <!-- Leitor do PDF da meta (aberto pelo "Ler agora" da janela de estudo, js/estudos.sessao.js).
       O arquivo vem da aba do painel (window.opener.estSessao.pdfAberto) e não sai do computador.
       Usa o pdf.js para não depender da opção "Baixar PDFs" do Chrome/Edge. -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf_viewer.min.css" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #1b1e2b; color: #e6e8f0; font: 14px/1.4 system-ui, "Segoe UI", sans-serif; }
    header { position: fixed; inset: 0 0 auto 0; height: 48px; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: #23273a; border-bottom: 1px solid #343a55; z-index: 2; }
    #nome { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
    header button, header input { background: #2e3350; color: inherit; border: 1px solid #434a6e; border-radius: 6px; padding: 4px 10px; font: inherit; cursor: pointer; }
    header button:hover { border-color: #7f8bd6; }
    header input { width: 64px; text-align: center; cursor: text; }
    #faixa { color: #9aa3c7; font-size: 12px; white-space: nowrap; }
    #area { position: absolute; inset: 48px 0 0 0; overflow: auto; }
    #msg { padding: 80px 24px; text-align: center; color: #9aa3c7; }
    .pdfViewer .page { box-shadow: 0 2px 10px rgba(0, 0, 0, .5); }
  </style>
</head>
<body>
  <header>
    <span id="nome">Leitor de PDF</span>
    <span id="faixa"></span>
    <label>Pág. <input id="pag" type="number" min="1" aria-label="Página" /> <span id="total"></span></label>
    <button id="menos" type="button" aria-label="Diminuir zoom">−</button>
    <button id="largura" type="button">Largura</button>
    <button id="mais" type="button" aria-label="Aumentar zoom">+</button>
  </header>
  <div id="area"><div id="viewer" class="pdfViewer"></div></div>
  <p id="msg">Abrindo o PDF…</p>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <!-- O worker roda na própria página, como na importação de edital -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf_viewer.min.js"></script>
  <script>
  (async function () {
    const $ = id => document.getElementById(id);
    const msg = t => { $('msg').textContent = t; $('msg').hidden = !t; };
    let dados = null;
    try { dados = window.opener && window.opener.estSessao && window.opener.estSessao.pdfAberto(); } catch (e) { /* outra origem */ }
    if (!dados) { msg('Abra o PDF pelo "Ler agora" da janela de estudo, no Painel de Estudos.'); return; }

    document.title = dados.nome + ' — Leitor';
    $('nome').textContent = dados.nome;
    if (dados.ate) $('faixa').textContent = `meta: p. ${dados.de}–${dados.ate}`;

    const eventBus = new pdfjsViewer.EventBus();
    const linkService = new pdfjsViewer.PDFLinkService({ eventBus });
    const viewer = new pdfjsViewer.PDFViewer({ container: $('area'), viewer: $('viewer'), eventBus, linkService });
    linkService.setViewer(viewer);
    eventBus.on('pagesinit', () => {
      viewer.currentScaleValue = 'page-width';
      viewer.currentPageNumber = Math.min(dados.de || 1, viewer.pagesCount);
    });
    eventBus.on('pagechanging', ev => { $('pag').value = ev.pageNumber; });

    try {
      const doc = await pdfjsLib.getDocument({ data: await dados.arquivo.arrayBuffer() }).promise;
      viewer.setDocument(doc);
      linkService.setDocument(doc, null);
      $('total').textContent = 'de ' + doc.numPages;
      $('pag').max = doc.numPages;
      msg('');
    } catch (e) {
      console.error(e);
      msg('Não foi possível abrir este arquivo como PDF.');
      return;
    }

    $('pag').addEventListener('change', () => {
      const n = parseInt($('pag').value, 10);
      if (n >= 1 && n <= viewer.pagesCount) viewer.currentPageNumber = n;
    });
    $('menos').addEventListener('click', () => { viewer.currentScale = Math.max(0.3, viewer.currentScale / 1.15); });
    $('mais').addEventListener('click', () => { viewer.currentScale = Math.min(5, viewer.currentScale * 1.15); });
    $('largura').addEventListener('click', () => { viewer.currentScaleValue = 'page-width'; });
    window.addEventListener('resize', () => { if (viewer.currentScaleValue === 'page-width') viewer.currentScaleValue = 'page-width'; });
  })();
  </script>
</body>
</html>
