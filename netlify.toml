# Site estático: publica a própria pasta, sem etapa de build.
[build]
  publish = "."

# Cabeçalhos de segurança para todas as páginas.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Área pessoal fora dos buscadores.
[[headers]]
  for = "/apps/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# apps.json sempre atualizado (sem cache antigo depois de cadastrar um app).
[[headers]]
  for = "/apps.json"
  [headers.values]
    Cache-Control = "no-cache"

# Imagens: cache de 30 dias. Ao trocar uma imagem, troque também o nome do arquivo.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Documentação e SQL ficam na pasta, mas não são servidos no site.
[[redirects]]
  from = "/supabase/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/index.html"
  status = 404
  force = true
